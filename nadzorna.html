<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nadzorna plošča — Rok Morgan</title>
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --bg2:#1b1b1b; --card:#1f1f1f; --text:#f3efe7; --muted:#a8a29a;
    --gold:#e0b84c; --danger:#e05a4c; --ok:#4caf7d; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px;}

  /* PIN gate */
  #pin-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:16px;}
  #pin-gate h2{color:var(--gold);}
  #pin-input{font-size:1.6rem;letter-spacing:0.4em;text-align:center;width:200px;background:var(--bg2);border:1px solid #333;border-radius:12px;padding:12px;color:var(--text);}
  #pin-gate button{background:var(--gold);color:#1a1608;border:none;border-radius:12px;padding:12px 26px;font-weight:700;font-size:1rem;cursor:pointer;}
  #pin-error{color:var(--danger);font-size:0.85rem;min-height:1.2em;}

  header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 16px;}
  header.top h1{font-size:1.15rem;color:var(--gold);}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--ok);}

  .event-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;gap:10px;}
  .event-bar .event-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .event-bar .event-name{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--gold);margin-top:2px;}
  .event-btn{background:var(--bg2);color:var(--text);border:1px solid #333;border-radius:10px;padding:9px 14px;font-weight:600;font-size:0.85rem;cursor:pointer;white-space:nowrap;}
  .event-editor{display:none;gap:8px;margin-bottom:16px;}
  .event-editor input{flex:1;background:var(--bg2);border:1px solid #333;border-radius:10px;padding:11px 12px;color:var(--text);font-size:0.95rem;font-family:inherit;}
  .event-editor button{border:none;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;}
  .event-editor .save-btn{background:var(--gold);color:#1a1608;}
  .event-editor .cancel-btn{background:var(--bg2);color:var(--muted);border:1px solid #333;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;background:var(--card);border:1px solid #2a2a2a;color:var(--muted);font-weight:600;cursor:pointer;}
  .tab.active{background:var(--gold);color:#1a1608;border-color:var(--gold);}
  .badge{background:var(--danger);color:#fff;border-radius:20px;padding:1px 7px;font-size:0.72rem;margin-left:6px;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card);border:1px solid #2a2a2a;border-radius:var(--radius);padding:15px;margin-bottom:12px;}
  .card.new{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(0.97);opacity:0.4}100%{transform:scale(1);opacity:1}}
  .card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card .song{font-family:'Fraunces',serif;font-size:1.1rem;}
  .card .artist{color:var(--muted);font-size:0.85rem;}
  .card .amount{background:var(--gold);color:#1a1608;font-weight:700;border-radius:10px;padding:4px 10px;font-size:0.9rem;white-space:nowrap;}
  .card .amount.free{background:#333;color:var(--muted);}
  .card .guest{margin-top:8px;font-weight:600;}
  .card .msg{color:var(--muted);font-size:0.88rem;margin-top:3px;font-style:italic;}
  .card .time{color:#5c5850;font-size:0.75rem;margin-top:6px;}
  .card .actions{display:flex;gap:10px;margin-top:12px;}
  .card .actions button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:0.95rem;}
  .btn-accept{background:var(--ok);color:#0c2318;}
  .btn-reject{background:#3a2c2a;color:var(--danger);}
  .btn-alt{background:var(--bg2);color:var(--text);border:1px solid #333 !important;}

  .status-pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:0.75rem;font-weight:700;margin-top:8px;}
  .status-accepted, .status-playing_today{background:#213a2c;color:var(--ok);}
  .status-rejected, .status-declined{background:#3a2323;color:var(--danger);}
  .status-next_time{background:#2a2a1c;color:var(--gold);}
  .status-played{background:#1c2a3a;color:#6ab0e0;}
  .played-count{color:var(--muted);font-size:0.82rem;margin:-4px 0 10px;}

  .empty-msg{color:var(--muted);text-align:center;padding:30px 0;font-size:0.9rem;}
  .section-label{color:var(--muted);font-size:0.78rem;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px;}

  .queue-item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .queue-item.played{opacity:0.8;}
  .queue-pos{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--gold);min-width:26px;text-align:center;}
  .queue-info{flex:1;min-width:0;}
  .queue-song{font-weight:600;}
  .queue-artist{color:var(--muted);font-size:0.85rem;}
  .queue-guest{color:var(--muted);font-size:0.8rem;margin-top:2px;}
  .btn-play{background:var(--gold);color:#1a1608;border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:0.88rem;cursor:pointer;white-space:nowrap;}
  .played-tag{background:#1c2a3a;color:#6ab0e0;font-size:1.1rem;border-radius:8px;padding:6px 12px;}
  .rej-item{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;margin-bottom:8px;opacity:0.75;}
  .rej-item .song{font-weight:600;font-size:0.95rem;}
  .rej-item .artist{color:var(--muted);font-size:0.82rem;}

  .search-box{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:5;}
  .search-box input{width:100%;background:var(--bg2);border:1px solid #333;border-radius:12px;padding:13px 14px;color:var(--text);font-size:1rem;font-family:inherit;}
  .song-cat{color:var(--gold);font-size:0.78rem;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px;font-weight:700;}
  .song-item{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .song-item .title{font-weight:600;}
  .song-item .artist{color:var(--muted);font-size:0.85rem;}
  .song-badge{display:inline-block;font-size:0.68rem;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;}
  .badge-queued{background:#2a2a1c;color:var(--gold);}
  .badge-played{background:#1c2a3a;color:#6ab0e0;}
  .add-btn{background:var(--gold);color:#1a1608;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:0.85rem;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>

<div id="pin-gate">
  <h2>🎸 Nadzorna plošča</h2>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">
  <button onclick="checkPin()">Vstopi</button>
  <div id="pin-error"></div>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <header class="top">
    <h1>🎸 Nadzorna plošča</h1>
    <div><span class="live-dot"></span><span style="color:var(--muted);font-size:0.8rem;">v živo</span></div>
  </header>

  <div class="event-bar">
    <div>
      <div class="event-label">Trenutni dogodek</div>
      <div class="event-name" id="event-name-display">—</div>
    </div>
    <button class="event-btn" onclick="openEventEditor()">Spremeni</button>
  </div>
  <div class="event-editor" id="event-editor">
    <input type="text" id="event-input" placeholder="npr. Vitaminček 31.8.">
    <button class="save-btn" onclick="saveEvent()">Shrani</button>
    <button class="cancel-btn" onclick="closeEventEditor()">Prekliči</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-req" onclick="switchTab('req')">Zahtevki <span class="badge" id="badge-req" style="display:none;">0</span></div>
    <div class="tab" id="tab-wish" onclick="switchTab('wish')">Želje <span class="badge" id="badge-wish" style="display:none;">0</span></div>
    <div class="tab" id="tab-set" onclick="switchTab('set')">Setlista</div>
  </div>

  <!-- ZAHTEVKI -->
  <div class="panel active" id="panel-req">
    <div id="req-pending"></div>

    <div class="section-label">Čakalna vrsta</div>
    <div id="req-queue"></div>

    <div class="section-label">🎵 Odigrano nocoj <span id="played-count"></span></div>
    <div id="req-played"></div>

    <div class="section-label">Zavrnjeno</div>
    <div id="req-rejected"></div>
  </div>

  <!-- ŽELJE -->
  <div class="panel" id="panel-wish">
    <div id="wish-pending"></div>
    <div class="section-label">Zgodovina</div>
    <div id="wish-history"></div>
  </div>

  <!-- SETLISTA -->
  <div class="panel" id="panel-set">
    <div class="search-box">
      <input type="text" id="set-search" placeholder="Išči po naslovu ali izvajalcu… " oninput="renderSetlist()">
    </div>
    <div id="set-results"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ NASTAVITVE ============
const SUPABASE_URL = "https://jrmsisnycnqbeahkxyly.supabase.co";
const SUPABASE_KEY = "sb_publishable_ifjKIvKIlMXRxB2uRN9DwA_GJI7ARZb";
const ADMIN_PIN = "1234"; // TODO: Rok — zamenjaj s svojim PIN-om
// =====================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let songsMap = {};
let ALL_SONGS = [];
let requests = [];       // all loaded requests
let wishlist = [];       // all loaded wishlist requests
let CURRENT_EVENT = null;

const CATEGORY_LABELS = {
  "Angleške": "Angleške / English",
  "Slovenske": "Slovenske / Slovenian",
  "Italijanske": "Italijanske / Italian",
  "Španske": "Španske / Spanish",
  "Ex-Yu": "Ex-Yu"
};

function norm(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}

// ---------- PIN gate ----------
function checkPin(){
  const val = document.getElementById("pin-input").value;
  if (val === ADMIN_PIN){
    localStorage.setItem("admin_authed_kitara", "yes");
    enterDashboard();
  } else {
    document.getElementById("pin-error").textContent = "Napačen PIN.";
  }
}
document.getElementById("pin-input").addEventListener("keydown", e=>{ if(e.key==="Enter") checkPin(); });

function enterDashboard(){
  document.getElementById("pin-gate").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  init();
}
if (localStorage.getItem("admin_authed_kitara") === "yes"){ enterDashboard(); }

// ---------- Tabs ----------
function switchTab(t){
  document.getElementById("tab-req").classList.toggle("active", t==="req");
  document.getElementById("tab-wish").classList.toggle("active", t==="wish");
  document.getElementById("tab-set").classList.toggle("active", t==="set");
  document.getElementById("panel-req").classList.toggle("active", t==="req");
  document.getElementById("panel-wish").classList.toggle("active", t==="wish");
  document.getElementById("panel-set").classList.toggle("active", t==="set");
  if (t==="set") renderSetlist();
}

// ---------- Sound + vibration ----------
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.start(); o.stop(ctx.currentTime+0.36);
  }catch(e){}
  if (navigator.vibrate) { try{ navigator.vibrate([180,60,180]); }catch(e){} }
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('sl-SI', {hour:'2-digit', minute:'2-digit'});
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- Trenutni dogodek ----------
async function loadEvent(){
  const { data } = await sb.from("app_settings").select("current_event").eq("id", true).single();
  CURRENT_EVENT = data ? data.current_event : null;
  document.getElementById("event-name-display").textContent = CURRENT_EVENT || "(ni nastavljen — vsi vidijo vso zgodovino)";
}

function openEventEditor(){
  document.getElementById("event-input").value = CURRENT_EVENT || "";
  document.getElementById("event-editor").style.display = "flex";
  document.getElementById("event-input").focus();
}
function closeEventEditor(){
  document.getElementById("event-editor").style.display = "none";
}
async function saveEvent(){
  const val = document.getElementById("event-input").value.trim();
  if (!val) return;
  await sb.from("app_settings").update({ current_event: val }).eq("id", true);
  CURRENT_EVENT = val;
  document.getElementById("event-name-display").textContent = val;
  closeEventEditor();
  renderRequests(false);
  renderWishlist(false);
}
document.getElementById("event-input") && document.getElementById("event-input").addEventListener("keydown", e=>{ if(e.key==="Enter") saveEvent(); });

// ---------- Init: load songs + data + subscribe realtime ----------
async function init(){
  await loadEvent();

  const { data: songs } = await sb.from("songs").select("*").eq("is_active", true).order("position", { ascending:true });
  ALL_SONGS = songs || [];
  ALL_SONGS.forEach(s => songsMap[s.id] = s);

  await refreshRequests();
  await refreshWishlist();

  sb.channel('requests-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'requests' }, payload => {
      requests.unshift(payload.new);
      renderRequests(true);
      beep();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'requests' }, payload => {
      const idx = requests.findIndex(r=>r.id===payload.new.id);
      if (idx>-1) requests[idx] = payload.new;
      renderRequests(false);
    })
    .subscribe();

  sb.channel('wishlist-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wishlist_requests' }, payload => {
      wishlist.unshift(payload.new);
      renderWishlist(true);
      beep();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'wishlist_requests' }, payload => {
      const idx = wishlist.findIndex(r=>r.id===payload.new.id);
      if (idx>-1) wishlist[idx] = payload.new;
      renderWishlist(false);
    })
    .subscribe();
}

async function refreshRequests(){
  const { data } = await sb.from("requests").select("*").order("created_at", { ascending:false }).limit(100);
  requests = data || [];
  renderRequests(false);
}
async function refreshWishlist(){
  const { data } = await sb.from("wishlist_requests").select("*").order("created_at", { ascending:false }).limit(100);
  wishlist = data || [];
  renderWishlist(false);
}

// ---------- Render: Requests ----------
function renderRequests(justArrived){
  const pending = requests.filter(r=>r.status==="new").sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  const history = requests.filter(r=>r.status!=="new" && (!CURRENT_EVENT || r.event_name===CURRENT_EVENT)).slice(0,30);

  const badge = document.getElementById("badge-req");
  if (pending.length){ badge.style.display="inline-block"; badge.textContent = pending.length; }
  else { badge.style.display="none"; }

  const pendBox = document.getElementById("req-pending");
  if (!pending.length){
    pendBox.innerHTML = '<div class="empty-msg">Trenutno ni novih zahtevkov.</div>';
  } else {
    pendBox.innerHTML = pending.map(r=>{
      const song = songsMap[r.song_id] || {title:"(neznan komad)", artist:""};
      const amt = Number(r.amount)>0 ? `<div class="amount">${Number(r.amount).toFixed(2)} €</div>` : `<div class="amount free">brez plačila</div>`;
      return `<div class="card new">
        <div class="row1">
          <div><div class="song">${escapeHtml(song.title)}</div><div class="artist">${escapeHtml(song.artist)}</div></div>
          ${amt}
        </div>
        <div class="guest">👤 ${escapeHtml(r.guest_name)}</div>
        ${r.message ? `<div class="msg">"${escapeHtml(r.message)}"</div>` : ``}
        <div class="time">${fmtTime(r.created_at)}</div>
        <div class="actions">
          <button class="btn-accept" onclick="setRequestStatus('${r.id}','accepted')">✓ Sprejmi</button>
          <button class="btn-reject" onclick="setRequestStatus('${r.id}','rejected')">✕ Zavrni</button>
        </div>
      </div>`;
    }).join("");
  }

  const queue = history.filter(r=>r.status==="accepted" && !r.played_at)
    .sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  const played = history.filter(r=>r.status==="accepted" && r.played_at)
    .sort((a,b)=> new Date(b.played_at)-new Date(a.played_at));
  const rejected = history.filter(r=>r.status!=="accepted");

  document.getElementById("played-count").textContent = played.length ? `(${played.length})` : "";

  const queueBox = document.getElementById("req-queue");
  if (!queue.length){
    queueBox.innerHTML = '<div class="empty-msg">Čakalna vrsta je prazna.</div>';
  } else {
    queueBox.innerHTML = queue.map((r,i)=>{
      const song = songsMap[r.song_id] || {title:"(neznan komad)", artist:""};
      const tip = Number(r.amount)>0 ? ` · ${Number(r.amount).toFixed(2)} €` : ``;
      return `<div class="queue-item">
        <div class="queue-pos">${i+1}</div>
        <div class="queue-info">
          <div class="queue-song">${escapeHtml(song.title)}</div>
          <div class="queue-artist">${escapeHtml(song.artist)}</div>
          <div class="queue-guest">👤 ${escapeHtml(r.guest_name)}${tip}</div>
        </div>
        <button class="btn-play" onclick="markPlayed('${r.id}')">▶ Odigrano</button>
      </div>`;
    }).join("");
  }

  const playedBox = document.getElementById("req-played");
  if (!played.length){
    playedBox.innerHTML = '<div class="empty-msg">Še nič odigranega nocoj.</div>';
  } else {
    playedBox.innerHTML = played.map(r=>{
      const song = songsMap[r.song_id] || {title:"(neznan komad)", artist:""};
      return `<div class="queue-item played">
        <div class="queue-info">
          <div class="queue-song">${escapeHtml(song.title)}</div>
          <div class="queue-artist">${escapeHtml(song.artist)}</div>
          <div class="queue-guest">👤 ${escapeHtml(r.guest_name)} · ${fmtTime(r.played_at)}</div>
        </div>
        <div class="played-tag">🎵</div>
      </div>`;
    }).join("");
  }

  const rejBox = document.getElementById("req-rejected");
  if (!rejected.length){
    rejBox.innerHTML = '<div class="empty-msg">Ni zavrnjenih zahtevkov.</div>';
  } else {
    rejBox.innerHTML = rejected.map(r=>{
      const song = songsMap[r.song_id] || {title:"(neznan komad)", artist:""};
      return `<div class="rej-item">
        <div class="song">${escapeHtml(song.title)}</div>
        <div class="artist">${escapeHtml(song.artist)} · 👤 ${escapeHtml(r.guest_name)}</div>
      </div>`;
    }).join("");
  }

  renderSetlist();
}

async function setRequestStatus(id, status){
  requests = requests.map(r => r.id===id ? {...r, status} : r);
  renderRequests(false);
  await sb.from("requests").update({ status }).eq("id", id);
}

async function markPlayed(id){
  const now = new Date().toISOString();
  requests = requests.map(r => r.id===id ? {...r, played_at: now} : r);
  renderRequests(false);
  await sb.from("requests").update({ played_at: now }).eq("id", id);
}

// ---------- Render: Setlista ----------
function renderSetlist(){
  const box = document.getElementById("set-results");
  if (!box) return;
  const q = norm(document.getElementById("set-search").value);
  const filtered = ALL_SONGS.filter(s => !q || norm(s.title).includes(q) || norm(s.artist).includes(q));
  if (!filtered.length){
    box.innerHTML = '<div class="empty-msg">Ni najdenih komadov.</div>';
    return;
  }
  let html = "";
  let lastCat = null;
  filtered.forEach(s=>{
    if (s.category !== lastCat){
      html += `<div class="song-cat">${escapeHtml(CATEGORY_LABELS[s.category] || s.category)}</div>`;
      lastCat = s.category;
    }
    const queued = requests.some(r=>r.song_id===s.id && r.status==="accepted" && !r.played_at && (!CURRENT_EVENT || r.event_name===CURRENT_EVENT));
    const playedTonight = requests.some(r=>r.song_id===s.id && r.status==="accepted" && r.played_at && (!CURRENT_EVENT || r.event_name===CURRENT_EVENT));
    let right;
    if (queued){
      right = '<span class="song-badge badge-queued">V vrsti</span>';
    } else {
      right = `${playedTonight ? '<span class="song-badge badge-played">Odigrano</span>' : ''}<button class="add-btn" onclick="addToQueue(${s.id})">+ Dodaj</button>`;
    }
    html += `<div class="song-item">
      <div><div class="title">${escapeHtml(s.title)}</div><div class="artist">${escapeHtml(s.artist)}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">${right}</div>
    </div>`;
  });
  box.innerHTML = html;
}

async function addToQueue(songId){
  const payload = {
    song_id: songId,
    guest_name: "Rok (sam izbral)",
    amount: 0,
    message: null,
    status: "accepted",
    played_at: null,
    event_name: CURRENT_EVENT
  };
  const { data, error } = await sb.from("requests").insert(payload).select().single();
  if (error){ console.error(error); return; }
  requests.unshift(data);
  renderRequests(false);
  renderSetlist();
}

// ---------- Render: Wishlist ----------
function renderWishlist(justArrived){
  const pending = wishlist.filter(r=>r.status==="new").sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  const history = wishlist.filter(r=>r.status!=="new" && (!CURRENT_EVENT || r.event_name===CURRENT_EVENT)).slice(0,30);

  const badge = document.getElementById("badge-wish");
  if (pending.length){ badge.style.display="inline-block"; badge.textContent = pending.length; }
  else { badge.style.display="none"; }

  const pendBox = document.getElementById("wish-pending");
  if (!pending.length){
    pendBox.innerHTML = '<div class="empty-msg">Trenutno ni novih želja.</div>';
  } else {
    pendBox.innerHTML = pending.map(r=>{
      return `<div class="card new">
        <div class="row1">
          <div><div class="song">${escapeHtml(r.title)}</div><div class="artist">${escapeHtml(r.artist)}</div></div>
        </div>
        ${r.guest_name ? `<div class="guest">👤 ${escapeHtml(r.guest_name)}</div>` : ``}
        ${r.message ? `<div class="msg">"${escapeHtml(r.message)}"</div>` : ``}
        <div class="time">${fmtTime(r.created_at)}</div>
        <div class="actions">
          <button class="btn-accept" onclick="setWishlistStatus('${r.id}','playing_today')">🎤 Igram danes</button>
          <button class="btn-alt" onclick="setWishlistStatus('${r.id}','next_time')">📝 Naslednjič</button>
          <button class="btn-reject" onclick="setWishlistStatus('${r.id}','declined')">✕</button>
        </div>
      </div>`;
    }).join("");
  }

  const histBox = document.getElementById("wish-history");
  if (!history.length){
    histBox.innerHTML = '<div class="empty-msg">Še ni zgodovine.</div>';
  } else {
    const labels = {playing_today:"Igram danes", next_time:"Naslednjič", declined:"Zavrnjeno"};
    histBox.innerHTML = history.map(r=>{
      return `<div class="card">
        <div class="row1">
          <div><div class="song">${escapeHtml(r.title)}</div><div class="artist">${escapeHtml(r.artist)}</div></div>
        </div>
        ${r.guest_name ? `<div class="guest">👤 ${escapeHtml(r.guest_name)}</div>` : ``}
        <div class="time">${fmtTime(r.created_at)}</div>
        <span class="status-pill status-${r.status}">${labels[r.status]||r.status}</span>
      </div>`;
    }).join("");
  }
}

async function setWishlistStatus(id, status){
  wishlist = wishlist.map(r => r.id===id ? {...r, status} : r);
  renderWishlist(false);
  await sb.from("wishlist_requests").update({ status }).eq("id", id);
}
</script>
